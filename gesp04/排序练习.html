<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GESP 四级 . sort 排序基础 专项练习</title>
<style>
  :root{
    --bg:#0f141b; --panel:#161d27; --panel2:#1c2531; --border:#2a3543;
    --text:#e6edf3; --muted:#8b98a9; --accent:#4ea1ff; --accent2:#7c5cff;
    --ok:#3fb950; --bad:#f85149; --warn:#d29922; --chip:#23303f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);line-height:1.65;padding:0 0 96px;
  }
  header{
    background:linear-gradient(135deg,#13202f,#1a2333);
    border-bottom:1px solid var(--border);padding:28px 24px 22px;
  }
  header h1{font-size:23px;font-weight:700;letter-spacing:.5px}
  header .sub{color:var(--muted);font-size:13.5px;margin-top:6px}
  .wrap{max-width:920px;margin:0 auto;padding:0 18px}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:22px 0 8px}
  .filter{
    background:var(--panel2);border:1px solid var(--border);color:var(--muted);
    padding:7px 14px;border-radius:20px;cursor:pointer;font-size:13px;transition:.15s;
  }
  .filter:hover{color:var(--text);border-color:var(--accent)}
  .filter.active{background:var(--accent);color:#06121f;border-color:var(--accent);font-weight:600}
  .spacer{flex:1}
  .card{
    background:var(--panel);border:1px solid var(--border);border-radius:14px;
    padding:20px 20px 18px;margin:16px 0;transition:.2s;
  }
  .card.correct{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok) inset}
  .card.wrong{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad) inset}
  .qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
  .badge{font-size:11.5px;padding:3px 9px;border-radius:6px;font-weight:600}
  .b-src{background:var(--chip);color:#9fc4ff}
  .b-type{background:#2a2440;color:#c4b3ff}
  .b-cat{background:#13312a;color:#5fe0b0}
  .qno{font-weight:700;color:var(--accent2);font-size:14px}
  .stem{font-size:15px;margin:8px 0 12px}
  pre{
    background:#0a0f15;border:1px solid var(--border);border-radius:10px;
    padding:14px 16px;overflow:auto;font-size:13px;line-height:1.55;
    font-family:"SF Mono",Menlo,Consolas,"Courier New",monospace;color:#cfe3ff;
    margin:6px 0 14px;
  }
  .opts{display:flex;flex-direction:column;gap:9px}
  .opt{
    display:flex;align-items:flex-start;gap:11px;background:var(--panel2);
    border:1px solid var(--border);border-radius:10px;padding:11px 13px;cursor:pointer;
    transition:.12s;font-size:14px;
  }
  .opt:hover{border-color:var(--accent)}
  .opt input{margin-top:4px;accent-color:var(--accent);width:16px;height:16px;flex-shrink:0}
  .opt .lab{font-weight:700;color:var(--muted);margin-right:2px}
  .opt.right{border-color:var(--ok);background:#10241b}
  .opt.wrongpick{border-color:var(--bad);background:#2a1614}
  .feedback{margin-top:13px;padding:13px 15px;border-radius:10px;font-size:13.5px;display:none}
  .feedback.show{display:block}
  .feedback.ok{background:#10241b;border:1px solid var(--ok);color:#a6f0c6}
  .feedback.no{background:#2a1614;border:1px solid var(--bad);color:#ffb3ae}
  .feedback .tag{font-weight:700;margin-right:6px}
  .feedback .exp{display:block;margin-top:7px;color:var(--muted);line-height:1.6}
  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:30px}
  .note{background:var(--panel2);border-left:3px solid var(--warn);padding:10px 14px;border-radius:8px;font-size:13px;color:var(--muted);margin:14px 0}
  .submitbar{
    position:fixed; left:0; right:0; bottom:0; z-index:50;
    background:#10161f; border-top:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 22px; box-shadow:0 -6px 22px rgba(0,0,0,.35);
  }
  .sb-score{font-size:14px;color:var(--muted)}
  .sb-score b{color:var(--accent);font-size:18px}
  .sb-btns{display:flex;gap:10px}
  .btn{
    background:var(--accent);color:#06121f;border:none;border-radius:9px;
    padding:9px 18px;font-size:13.5px;font-weight:600;cursor:pointer;transition:.15s;
  }
  .btn:hover{filter:brightness(1.08)}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
  .btn.ghost:hover{color:var(--text);border-color:var(--accent)}
  .summary{display:none;margin:18px 0 4px;padding:14px 18px;border-radius:10px;font-size:14px;line-height:1.6}
  .summary.show{display:block}
  .summary.allok{background:#10241b;border:1px solid var(--ok);color:#a6f0c6}
  .summary.hasswrong{background:#2a1614;border:1px solid var(--bad);color:#ffb3ae}
  .summary b{color:#fff}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>GESP 四级 . sort 排序基础 专项练习</h1>
    <div class="sub">聚焦: sort 结构 / 降序 / string 排序 / unique 去重 / 取值与中位数 / 复杂度</div>
  </div>
</header>

<div class="wrap">
  <div class="toolbar">
    <div class="filter active" data-cat="all">全部</div>
    <div class="filter" data-cat="sort基础">sort基础</div>
    <div class="filter" data-cat="降序排序">降序排序</div>
    <div class="filter" data-cat="string排序">string排序</div>
    <div class="filter" data-cat="去重unique">去重unique</div>
    <div class="filter" data-cat="取值与中位数">取值与中位数</div>
    <div class="filter" data-cat="复杂度">复杂度</div>
    <div class="spacer"></div>
  </div>

  <div class="note">选择题单选、判断题选正确/错误,做完点[提交答案]统一判分;错题标红并附解析,可点顶部标签按分类筛选。</div>

  <div id="list"></div>

  <div class="summary" id="summary"></div>

  <div class="submitbar">
    <div class="sb-score">本次得分:<b id="rc">0</b> / <b id="rt">10</b></div>
    <div class="sb-btns">
      <button class="btn" onclick="submitAll()">提交答案</button>
      <button class="btn ghost" onclick="resetAll()">重置</button>
    </div>
  </div>

  <footer>本练习由 GESP 课件整理生成 · 仅供学习使用</footer>
</div>
<script>
const DATA = [
  {
    "cat": "sort基础",
    "src": "GESP202406C4",
    "type": "单选题",
    "title": "sort 基本调用",
    "stem": "下列关于 C++ sort 函数的说法,正确的是( )。",
    "options": [
      "sort 只能对 int 类型数组排序",
      "sort(a, a + n) 对 a[0] 到 a[n-1] 升序排序",
      "sort 的时间复杂度是 O(n)",
      "sort 不需要包含任何头文件"
    ],
    "answer": 1,
    "exp": "sort(a, a+n) 左闭右开,排 a[0]..a[n-1];需 #include <algorithm>;平均 O(n log n)。"
  },
  {
    "cat": "降序排序",
    "src": "GESP202409C4",
    "type": "单选题",
    "title": "降序参数",
    "stem": "要对整型数组 a(共 n 个元素)从大到小排序,下列写法正确的是( )。",
    "options": [
      "sort(a, a + n, less<int>())",
      "sort(a, a + n, greater<int>())",
      "sort(a, a + n - 1)",
      "sort(a + 1, a + n)"
    ],
    "answer": 1,
    "exp": "greater<int>() 让大的排前面即降序;less 是默认升序。"
  },
  {
    "cat": "string排序",
    "src": "GESP202412C4",
    "type": "单选题",
    "title": "字符排序结果",
    "stem": "对 string s = \"cbda\"; 执行 sort(s.begin(), s.end()); 后,s 的值是( )。",
    "options": [
      "\"abcd\"",
      "\"dcba\"",
      "\"abcd\"(原顺序)",
      "编译错误"
    ],
    "answer": 0,
    "exp": "sort 对字符按 ASCII 升序排,得 \"abcd\"。"
  },
  {
    "cat": "去重unique",
    "src": "GESP202503C4",
    "type": "单选题",
    "title": "unique 去重后个数",
    "stem": "下列代码执行后,m 的值是( )。\nint a[] = {3, 1, 2, 3, 1}; int n = 5;\nsort(a, a + n);\nint m = unique(a, a + n) - a;",
    "code": "int a[] = {3, 1, 2, 3, 1};\nint n = 5;\nsort(a, a + n);\nint m = unique(a, a + n) - a;",
    "options": [
      "2",
      "3",
      "4",
      "5"
    ],
    "answer": 1,
    "exp": "排序后 {1,1,2,3,3},unique 去相邻重后保留 {1,2,3},m = 3。"
  },
  {
    "cat": "取值与中位数",
    "src": "GESP 课堂练习",
    "type": "单选题",
    "title": "中位数下标",
    "stem": "对已升序数组 a = {2,5,7,9,11}(n = 5),其中位数(最中间的数)对应的写法是( )。",
    "options": [
      "a[1]",
      "a[2]",
      "a[n / 2]",
      "a[n / 2 + 1]"
    ],
    "answer": 2,
    "exp": "即 a[2] = 7,下标从 0 起中位数为 a[n/2];n 为奇数时中位数下标为 n/2。"
  },
  {
    "cat": "sort基础",
    "src": "GESP202512C4",
    "type": "判断题",
    "stem": "调用 sort(a, a + n) 时,a + n 指向的元素会被包含在排序范围内。",
    "options": [
      "正确",
      "错误"
    ],
    "answer": 1,
    "exp": "sort 区间左闭右开,a + n 是尾后位置,不参与排序。"
  },
  {
    "cat": "降序排序",
    "src": "GESP 课堂练习",
    "type": "判断题",
    "stem": "sort 默认是升序排序,若要降序可以传 greater<int>() 作为第三个参数。",
    "options": [
      "正确",
      "错误"
    ],
    "answer": 0,
    "exp": "greater<int>() 让较大的元素排前面,即降序。"
  },
  {
    "cat": "string排序",
    "src": "GESP202506C4",
    "type": "判断题",
    "stem": "对 string 数组 w 用 sort(w, w + n) 排序,结果是按字符串长度排序。",
    "options": [
      "正确",
      "错误"
    ],
    "answer": 1,
    "exp": "默认按字典序(ASCII 逐字符比较)排,不是按长度;按长度需自定义 cmp。"
  },
  {
    "cat": "去重unique",
    "src": "GESP 课堂练习",
    "type": "判断题",
    "stem": "使用 unique 去重前必须先对数组排序,否则不相邻的重复元素去不掉。",
    "options": [
      "正确",
      "错误"
    ],
    "answer": 0,
    "exp": "unique 只消除相邻重复,所以必须先 sort。"
  },
  {
    "cat": "复杂度",
    "src": "GESP 课堂练习",
    "type": "判断题",
    "stem": "sort 的时间复杂度优于手写冒泡排序的最坏情况。",
    "options": [
      "正确",
      "错误"
    ],
    "answer": 0,
    "exp": "sort 平均 O(n log n),冒泡最坏 O(n^2),数据量大时 sort 明显更快。"
  }
];

const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const list = document.getElementById('list');

function render(){
  list.innerHTML = "";
  DATA.forEach((q,idx)=>{
    const card = document.createElement('div');
    card.className = "card" + (q.bonus ? " bonus" : "");
    card.dataset.cat = q.cat;
    card.id = "q"+idx;

    const graded = q.graded !== false && !q.bonus;
    let codeHtml = q.code ? `<pre>${esc(q.code)}</pre>` : "";

    if(!graded){
      // 拓展 / 编程题：仅展示，不判分
      card.innerHTML = `
        <div class="qhead">
          <span class="badge b-src">${esc(q.src||"")}</span>
          <span class="badge b-type">${esc(q.type||"拓展实践")}</span>
          <span class="badge b-cat">${esc(q.cat||"")}</span>
          <span class="qno">${esc(q.title||("第 "+(idx+1)+" 题"))}</span>
        </div>
        <div class="stem">${esc(q.stem||"")}</div>
        ${codeHtml}
        ${q.bonus && q.exp ? `<div class="feedback show"><span class="exp">${esc(q.exp)}</span></div>` : ""}
      `;
      list.appendChild(card);
      return;
    }

    let optsHtml = q.options.map((o,oi)=>`
      <label class="opt" data-oi="${oi}">
        <input type="radio" name="q${idx}" value="${oi}">
        <span><span class="lab">${String.fromCharCode(65+oi)}.</span> ${esc(o)}</span>
      </label>`).join("");

    card.innerHTML = `
      <div class="qhead">
        <span class="badge b-src">${esc(q.src||"")}</span>
        <span class="badge b-type">${esc(q.type||"")}</span>
        <span class="badge b-cat">${esc(q.cat||"")}</span>
        <span class="qno">第 ${idx+1} 题 · ${esc(q.title||"")}</span>
      </div>
      <div class="stem">${esc(q.stem||"")}</div>
      ${codeHtml}
      <div class="opts">${optsHtml}</div>
      <div class="feedback" id="fb${idx}"></div>
    `;
    list.appendChild(card);
  });
}

function gradeCard(idx, lock){
  const q = DATA[idx];
  const card = document.getElementById("q"+idx);
  const picked = document.querySelector(`input[name="q${idx}"]:checked`);
  const fb = document.getElementById("fb"+idx);
  const answered = !!picked;
  const pi = answered ? parseInt(picked.value) : -1;
  const ok = pi === q.answer;

  card.classList.remove("correct","wrong");
  card.classList.add(ok ? "correct":"wrong");
  card.querySelectorAll('.opt').forEach(op=>{
    op.classList.remove('right','wrongpick');
    const oi = parseInt(op.dataset.oi);
    if(oi === q.answer) op.classList.add('right');
    if(oi === pi && !ok) op.classList.add('wrongpick');
  });

  let tag;
  if(!answered){
    tag = `<span class="tag" style="color:var(--bad)">✗ 未作答</span> 正确答案：${String.fromCharCode(65+q.answer)}`;
  } else if(ok){
    tag = `<span class="tag" style="color:var(--ok)">✓ 回答正确</span>`;
  } else {
    tag = `<span class="tag" style="color:var(--bad)">✗ 回答错误</span> 正确答案：${String.fromCharCode(65+q.answer)}`;
  }
  fb.className = "feedback show " + (ok?"ok":"no");
  fb.innerHTML = tag + `<span class="exp">${esc(q.exp||"")}</span>`;

  if(lock) card.querySelectorAll('input[type=radio]').forEach(r=>r.disabled=true);
  return ok;
}

function submitAll(){
  let right=0, answered=0, total=0;
  const wrongList=[];
  DATA.forEach((q,idx)=>{
    const card = document.getElementById("q"+idx);
    if(card.style.display === 'none') return;       // 被筛选隐藏的题不计入
    if(q.graded === false || q.bonus) return;        // 拓展/编程题不计分
    total++;
    if(document.querySelector(`input[name="q${idx}"]:checked`)) answered++;
    const ok = gradeCard(idx, true);
    if(ok) right++; else wrongList.push(idx+1);
  });
  if(total === 0) return;
  const rate = Math.round(right/total*100);
  document.getElementById('rc').textContent = right;
  document.getElementById('rt').textContent = total;

  const sum = document.getElementById('summary');
  let msg = `本次作答：答对 <b>${right}</b> / ${total} 题（正确率 ${rate}%），已作答 ${answered} 题。`;
  if(wrongList.length>0){
    msg += ` 错题：第 ${wrongList.join('、')} 题已标红，解析（解题方法）见各题下方。`;
    sum.className = "summary show hasswrong";
  } else {
    msg += ` 全部正确，太棒了！`;
    sum.className = "summary show allok";
  }
  sum.innerHTML = msg;
  sum.scrollIntoView({behavior:'smooth', block:'start'});
}

function resetAll(){
  DATA.forEach((q,idx)=>{
    if(q.graded === false || q.bonus) return;
    const card = document.getElementById("q"+idx);
    const fb = document.getElementById("fb"+idx);
    card.classList.remove("correct","wrong");
    fb.className="feedback"; fb.innerHTML="";
    card.querySelectorAll('input[type=radio]').forEach(r=>{r.checked=false; r.disabled=false;});
    card.querySelectorAll('.opt').forEach(op=>op.classList.remove('right','wrongpick'));
  });
  const sum = document.getElementById('summary');
  sum.className="summary"; sum.innerHTML="";
  document.getElementById('rc').textContent='0';
}

// 筛选
document.querySelectorAll('.filter').forEach(f=>{
  f.addEventListener('click',()=>{
    document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));
    f.classList.add('active');
    const cat=f.dataset.cat;
    document.querySelectorAll('#list .card').forEach(c=>{
      if(cat==='all' || c.dataset.cat===cat) c.style.display='';
      else c.style.display='none';
    });
  });
});

render();

</script>
</body>
</html>
